<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account – OpenDev Labs (opendev-labs.com)</title>
  <meta name="description" content="Create an OpenDev Labs account with high-precision Cyberpunk 3D Matrix card registration.">
  
  <link rel="stylesheet" href="styles.css">
  
  <!-- CDNs for Three.js, GSAP & Lucide Icons -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <style>
    @import 'https://fonts.googleapis.com/css?family=Open+Sans|Quicksand:400,700';

    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #09090b;
      font-family: 'Quicksand', sans-serif;
      -webkit-font-smoothing: antialiased;
      color: #ffffff;
      selection-background-color: #f02050;
      selection-color: #ffffff;
    }

    /* WebGL Canvas Background */
    #canvas-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
    }

    /* Top Brand Header */
    .top-brand-bar {
      position: absolute;
      top: 24px;
      left: 28px;
      z-index: 50;
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }
    .top-brand-bar .logo-icon {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: linear-gradient(135deg, #f02050, #ff4d73);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 20px rgba(240, 32, 80, 0.4);
    }
    .top-brand-bar .logo-text {
      font-weight: 800;
      font-size: 1.15rem;
      color: #ffffff;
      letter-spacing: -0.02em;
    }
    .top-brand-bar .logo-text span {
      color: #f02050;
    }

    /* VishwaLeader Cyberpunk 3D Card Architecture */
    .login-page-container-custom {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 10;
      overflow: auto;
      pointer-events: none;
    }
    .login-page-container-custom .box,
    .top-brand-bar {
      pointer-events: auto;
    }
    .login-page-container-custom *, 
    .login-page-container-custom *::before, 
    .login-page-container-custom *::after { 
      box-sizing: border-box; 
    }

    .login-page-container-custom h2, 
    .login-page-container-custom h3 { 
      font-size: 15px; 
      letter-spacing: 0.5px; 
      line-height: 20px; 
      margin: 0; 
    }
    .login-page-container-custom h2 { 
      color: #f02050; 
      font-weight: 800; 
      line-height: 1; 
      text-transform: uppercase;
      font-family: 'Quicksand', sans-serif;
    }
    .login-page-container-custom h3 { 
      color: #ffffff; 
      text-align: right; 
      font-weight: 700;
    }

    .login-page-container-custom .i { 
      width: 20px; 
      height: 20px; 
    }
    
    .login-page-container-custom .i-login {
      cursor: pointer;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='64' height='64' viewBox='0 0 416.229 416.229'><path d='M403.729,29.65H71.802c-6.903,0-12.5,5.597-12.5,12.5v86.363c0,9.903,5.597,12.5,12.5,12.5s12.5-5.597,12.5-12.5V54.65 h306.927v306.928H84.302v-73.861c0-6.903-5.597-12.5-12.5-12.5s-12.5,5.597-12.5,12.5v86.361c0,6.903,5.597,12.5,12.5,12.5 h331.927c6.902,0,12.5-5.597,12.5-12.5V42.15C416.229,35.247,410.631,29.65,403.729,29.65z' fill='%23f02050'/><path d='M185.417,287.811c0,5.057,3.045,9.613,7.716,11.55c1.547,0.642,3.17,0.95,4.781,0.95c3.253,0,6.451-1.27,8.842-3.66 l79.697-79.697c2.344-2.344,3.66-5.523,3.66-8.839c0-3.316-1.316-6.495-3.66-8.839l-79.697-79.697 c-3.575-3.575-8.951-4.646-13.623-2.71c-4.671,1.936-7.716,6.493-7.716,11.549v67.197H12.5c-6.903,0-12.5,5.597-12.5,12.5 c0,9.903,5.597,12.5,12.5,12.5h172.917V287.811L185.417,287.811z M210.417,158.594l49.521,49.52l-49.521,49.521V158.594z' fill='%23f02050'/></svg>");
      background-size: 18px 18px; 
      background-repeat: no-repeat; 
      background-position: center; 
      transition: opacity 0.2s;
    }
    .login-page-container-custom .i-login:hover { opacity: 0.8; }

    .login-page-container-custom .i-more {
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='64' height='64' viewBox='0 0 612 612'><path d='M76.5,229.5C34.3,229.5,0,263.8,0,306s34.3,76.5,76.5,76.5S153,348.2,153,306S118.7,229.5,76.5,229.5z M76.5,344.2 c-21.1,0-38.2-17.101-38.2-38.2c0-21.1,17.1-38.2,38.2-38.2s38.2,17.1,38.2,38.2C114.7,327.1,97.6,344.2,76.5,344.2z M535.5,229.5c-42.2,0-76.5,34.3-76.5,76.5s34.3,76.5,76.5,76.5S612,348.2,612,306S577.7,229.5,535.5,229.5z M535.5,344.2 c-21.1,0-38.2-17.101-38.2-38.2c0-21.1,17.101-38.2,38.2-38.2s38.2,17.1,38.2,38.2C573.7,327.1,556.6,344.2,535.5,344.2z M306,229.5c-42.2,0-76.5,34.3-76.5,76.5s34.3,76.5,76.5,76.5s76.5-34.3,76.5-76.5S348.2,229.5,306,229.5z M306,344.2 c-21.1,0-38.2-17.101-38.2-38.2c0-21.1,17.1-38.2,38.2-38.2c21.1,0,38.2,17.1,38.2,38.2C344.2,327.1,327.1,344.2,306,344.2z' fill='%23f02050'/></svg>");
      background-size: 20px 20px; 
      background-repeat: no-repeat; 
      background-position: center;
    }

    .login-page-container-custom .i-left {
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='64' height='64' viewBox='0 0 414.298 414.299'><path d='M3.663,410.637c2.441,2.44,5.64,3.661,8.839,3.661c3.199,0,6.398-1.221,8.839-3.661l185.809-185.81l185.81,185.811 c2.44,2.44,5.641,3.661,8.84,3.661c3.198,0,6.397-1.221,8.839-3.661c4.881-4.881,4.881-12.796,0-17.679l-185.811-185.81 l185.811-185.81c4.881-4.882,4.881-12.796,0-17.678c-4.882-4.882-12.796-4.882-17.679,0l-185.81,185.81L21.34,3.663 c-4.882-4.882-12.796-4.882-17.678,0c-4.882,4.881-4.882,12.796,0,17.678l185.81,185.809L3.663,392.959 C-1.219,397.841-1.219,405.756,3.663,410.637z' fill='%23f02050'/></svg>");
      background-size: 16px 16px; 
      background-repeat: no-repeat; 
      background-position: center;
    }

    .login-page-container-custom .box { 
      width: 340px; 
      position: absolute; 
      top: 50%; 
      left: 50%; 
      transform: translate(-50%, -50%); 
      z-index: 10; 
    }
    
    .login-page-container-custom .box-form { 
      width: 330px; 
      position: relative; 
      left: 0; 
      z-index: 1; 
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1); 
    }
    .login-page-container-custom .box.info-opened .box-form { 
      left: -38%; 
    }

    .login-page-container-custom .box-login-tab {
      width: 50%; 
      height: 40px; 
      background: #0c0c0e; 
      position: relative; 
      float: left; 
      z-index: 1;
      border-radius: 8px 8px 0 0; 
      border: 1px solid rgba(240, 32, 80, 0.4); 
      border-bottom: none;
      transform: perspective(5px) rotateX(0.93deg) translateZ(-1px); 
      transform-origin: 0 0;
      backface-visibility: hidden; 
      box-shadow: 0 -10px 25px rgba(0,0,0,0.5);
    }

    .login-page-container-custom .box-login-title {
      width: 50%; 
      height: 40px; 
      position: absolute; 
      z-index: 2; 
      display: flex; 
      align-items: center; 
      padding-left: 16px; 
      gap: 8px;
    }

    .login-page-container-custom .box-login {
      position: relative; 
      top: -4px; 
      width: 330px; 
      background: rgba(12, 12, 14, 0.95); 
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(240, 32, 80, 0.4); 
      text-align: center; 
      overflow: hidden; 
      z-index: 2;
      border-top-right-radius: 12px; 
      border-bottom-left-radius: 12px; 
      border-bottom-right-radius: 12px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.7), 0 0 30px rgba(240,32,80,0.15);
    }

    .login-page-container-custom .box-info {
      width: 270px; 
      top: 55px; 
      position: absolute; 
      right: -5px; 
      opacity: 0; 
      pointer-events: none;
      padding: 18px 18px 18px 30px; 
      background-color: rgba(12, 12, 14, 0.92); 
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(240, 32, 80, 0.3); 
      z-index: 0; 
      border-radius: 12px; 
      box-shadow: 0 25px 50px rgba(0,0,0,0.7); 
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .login-page-container-custom .box.info-opened .box-info { 
      right: -38%; 
      opacity: 1; 
      pointer-events: auto; 
    }

    @media (max-width: 640px) {
      .login-page-container-custom .box { width: 90%; max-width: 340px; }
      .login-page-container-custom .box-form { width: 100%; }
      .login-page-container-custom .box-login { width: 100%; }
      .login-page-container-custom .box-login-tab { width: 50%; }
      .login-page-container-custom .box-login-title { width: 50%; }
      .login-page-container-custom .box.info-opened .box-form { left: 0; opacity: 0.15; transform: scale(0.95); pointer-events: none; }
      .login-page-container-custom .box-info { width: 100%; right: 0; top: 40px; padding: 20px; z-index: 10; transform: translateY(20px); opacity: 0; pointer-events: none; }
      .login-page-container-custom .box.info-opened .box-info { right: 0; transform: translateY(0); opacity: 1; pointer-events: auto; }
    }

    .login-page-container-custom .line-wh { 
      width: 100%; 
      height: 1px; 
      margin: 14px auto; 
      border-top: 1px solid rgba(255,255,255,0.12); 
    }

    .login-page-container-custom a { text-decoration: none; }
    .login-page-container-custom button:focus { outline:0; }
    .login-page-container-custom .b { height: 24px; line-height: 24px; background-color: transparent; border: none; cursor: pointer; }
    .login-page-container-custom .b-form { opacity: 0.7; margin: 10px 20px; float: right; }
    .login-page-container-custom .b-info { opacity: 0.7; float: left; }
    .login-page-container-custom .b-form:hover, .login-page-container-custom .b-info:hover { opacity: 1; }

    .login-page-container-custom .b-support, 
    .login-page-container-custom .b-cta {
      width: 100%; 
      padding: 0px 15px; 
      font-family: 'Quicksand', sans-serif; 
      font-weight: 700; 
      font-size: 14px;
      line-height: 36px; 
      cursor: pointer; 
      border-radius: 12px; 
      display: block; 
      text-align: center; 
      transition: all 0.25s;
    }
    .login-page-container-custom .b-support { 
      border: 1px solid #f02050; 
      background-color: transparent; 
      color: #f02050; 
      margin: 8px 0; 
    }
    .login-page-container-custom .b-cta { 
      border: 1px solid #f02050; 
      background-color: #f02050; 
      color: #ffffff; 
    }
    .login-page-container-custom .b-support:hover, 
    .login-page-container-custom .b-cta:hover { 
      color: #ffffff; 
      background-color: #d01840; 
      border-color: #d01840; 
      box-shadow: 0 0 15px rgba(240, 32, 80, 0.4);
    }

    .login-page-container-custom .fieldset-body { display: table; width: 100%; }
    .login-page-container-custom .fieldset-body p { width: 100%; display: inline-table; padding: 6px 20px; margin-bottom: 2px; position: relative; }
    
    .login-page-container-custom label { 
      float: left; 
      width: 100%; 
      color: #a1a1aa; 
      font-size: 11px; 
      font-weight: 700; 
      text-align: left; 
      line-height: 1.5; 
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .login-page-container-custom label.checkbox { 
      float: left; 
      padding: 6px 20px; 
      line-height: 1.7; 
      display: flex; 
      align-items: center; 
      gap: 8px; 
      cursor: pointer; 
      text-transform: none;
      font-size: 12px;
      color: #a1a1aa;
    }
    .login-page-container-custom label.checkbox input { margin: 0; width: 14px; height: 14px; cursor: pointer; accent-color: #f02050; }

    .login-page-container-custom input[type=text], 
    .login-page-container-custom input[type=email],
    .login-page-container-custom input[type=password] {
      width: 100%; 
      height: 38px; 
      padding: 0px 12px; 
      background-color: rgba(9, 9, 11, 0.7); 
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      display: inline; 
      color: #ffffff; 
      font-size: 14px; 
      font-weight: 500; 
      float: left; 
      box-shadow: inset 1px 1px 3px rgba(0,0,0,0.6);
      transition: all 0.2s;
    }
    .login-page-container-custom input[type=text]:focus, 
    .login-page-container-custom input[type=email]:focus,
    .login-page-container-custom input[type=password]:focus { 
      background-color: rgba(9, 9, 11, 0.95); 
      border-color: #f02050; 
      box-shadow: 0 0 10px rgba(240, 32, 80, 0.3);
      outline: none; 
    }

    .login-page-container-custom input[type=submit] {
      width: calc(100% - 40px); 
      height: 44px; 
      margin: 16px 20px 8px 20px; 
      padding: 0px 20px; 
      font-family: 'Quicksand', sans-serif; 
      font-weight: 700;
      font-size: 14px; 
      letter-spacing: 1px;
      color: #ffffff; 
      text-align: center; 
      background: linear-gradient(135deg, #f02050, #ff4d73); 
      border: none;
      border-radius: 10px;
      cursor: pointer; 
      transition: all 0.25s;
      box-shadow: 0 4px 20px rgba(240, 32, 80, 0.35);
    }
    .login-page-container-custom input[type=submit]:hover { 
      background: linear-gradient(135deg, #d01840, #f02050); 
      box-shadow: 0 6px 25px rgba(240, 32, 80, 0.5);
      transform: translateY(-1px);
    }

    .login-page-container-custom .google-divider { 
      display: flex; 
      align-items: center; 
      text-align: center; 
      color: #71717a; 
      font-size: 11px; 
      margin: 14px 20px 8px 20px; 
      font-weight: 700; 
      letter-spacing: 1px;
    }
    .login-page-container-custom .google-divider::before, 
    .login-page-container-custom .google-divider::after { 
      content: ''; 
      flex: 1; 
      border-bottom: 1px solid rgba(255, 255, 255, 0.12); 
    }
    .login-page-container-custom .google-divider:not(:empty)::before { margin-right: .6em; }
    .login-page-container-custom .google-divider:not(:empty)::after { margin-left: .6em; }

    .login-page-container-custom .b-google-login { 
      width: calc(100% - 40px); 
      height: 42px; 
      margin: 8px 20px 20px 20px; 
      background-color: #18181b; 
      border: 1px solid rgba(255, 255, 255, 0.15); 
      border-radius: 10px; 
      color: #ffffff; 
      font-family: 'Quicksand', sans-serif; 
      font-weight: 700; 
      font-size: 13px; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      gap: 10px; 
      cursor: pointer; 
      transition: all 0.2s; 
    }
    .login-page-container-custom .b-google-login:hover { 
      background-color: #27272a; 
      border-color: #f02050; 
    }
  </style>
</head>
<body>

  <!-- WebGL 3D Canvas Background Container -->
  <div id="canvas-container"></div>

  <!-- Top Left Brand Header -->
  <a href="index.html" class="top-brand-bar">
    <div class="logo-icon">
      <i data-lucide="box" style="width:20px; height:20px; color:#FFF;"></i>
    </div>
    <span class="logo-text">opendev<span>-labs</span></span>
  </a>

  <!-- VishwaLeader Cyberpunk 3D Card Modal Container -->
  <div class="login-page-container-custom">
    <div class="box" id="login-box">
      
      <!-- Main Form Card -->
      <div class="box-form">
        <div class="box-login-tab"></div>
        <div class="box-login-title">
          <div class="i i-login" onclick="window.location.href='index.html'" title="Back to Home"></div>
          <h2 id="auth-card-mode-title">SIGN UP</h2>
        </div>

        <div class="box-login">
          <form onsubmit="handleAuthSubmit(event)" class="fieldset-body">
            <button type="button" onclick="toggleInfoDrawer()" class="b b-form i i-more" title="More Info / Account Actions"></button>
            
            <!-- Full Name -->
            <p class="field" id="field-name-group">
              <label htmlFor="user-name">FULL NAME</label>
              <input type="text" id="user-name" required placeholder="" />
            </p>

            <!-- Email -->
            <p class="field">
              <label htmlFor="user-email">WORK EMAIL</label>
              <input type="email" id="user-email" required placeholder="" />
            </p>

            <!-- Password -->
            <p class="field">
              <label htmlFor="user-password">PASSWORD</label>
              <input type="password" id="user-password" required placeholder="••••••••••••" />
            </p>

            <!-- Alert Message Banner -->
            <div id="alert-banner" style="display:none; margin:10px 20px; padding:10px; border-radius:8px; font-size:12px; text-align:left; font-weight:700;"></div>

            <!-- Submit Button -->
            <input type="submit" id="submit-btn" value="REGISTER" />

            <!-- Google SSO -->
            <div class="google-divider"><span>OR</span></div>
            <button type="button" onclick="handleSocialAuth('Google')" class="b-google-login">
              <svg style="width:16px; height:16px;" viewBox="0 0 24 24">
                <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
                <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/>
              </svg>
              SIGN UP WITH GOOGLE
            </button>
          </form>
        </div>
      </div>

      <!-- Slide-Out Info & Options Drawer -->
      <div class="box-info">
        <div style="width:100%; display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;">
          <button type="button" onclick="toggleInfoDrawer(false)" class="b b-info i i-left" title="Back"></button>
          <h3>Need Help?</h3>
        </div>
        <div class="line-wh"></div>
        <button type="button" onclick="alert('Client Support Email: opendev.office@gmail.com')" class="b-support">Contact Support</button>
        <button type="button" onclick="window.location.href='auth.html'" class="b-support">Sovereign Auth Protocol</button>
        <div class="line-wh"></div>
        <button type="button" onclick="toggleAuthMode()" id="mode-toggle-cta" class="b-cta">
          BACK TO LOGIN
        </button>
      </div>

    </div>
  </div>

  <!-- 3D Engine & Interactive Core Script -->
  <script src="app.js"></script>
  <script>
    let isInfoOpen = false;
    let authMode = 'signup'; // 'login' | 'signup'

    function toggleInfoDrawer(forceState) {
      const box = document.getElementById('login-box');
      if (!box) return;
      if (typeof forceState === 'boolean') {
        isInfoOpen = forceState;
      } else {
        isInfoOpen = !isInfoOpen;
      }
      box.classList.toggle('info-opened', isInfoOpen);
    }

    function toggleAuthMode() {
      authMode = (authMode === 'login') ? 'signup' : 'login';
      const title = document.getElementById('auth-card-mode-title');
      const nameGroup = document.getElementById('field-name-group');
      const submitBtn = document.getElementById('submit-btn');
      const ctaBtn = document.getElementById('mode-toggle-cta');

      if (authMode === 'signup') {
        title.innerText = 'SIGN UP';
        nameGroup.style.display = 'block';
        submitBtn.value = 'REGISTER';
        ctaBtn.innerText = 'BACK TO LOGIN';
      } else {
        title.innerText = 'LOGIN';
        nameGroup.style.display = 'none';
        submitBtn.value = 'GET STARTED';
        ctaBtn.innerText = 'CREATE ACCOUNT';
      }

      toggleInfoDrawer(false);
    }

    function handleAuthSubmit(e) {
      e.preventDefault();
      const banner = document.getElementById('alert-banner');
      banner.style.display = 'block';
      banner.style.background = 'rgba(0, 255, 136, 0.15)';
      banner.style.border = '1px solid rgba(0, 255, 136, 0.4)';
